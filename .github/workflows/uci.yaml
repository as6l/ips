name: Update

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download base China IP CIDR
        run: |
          curl -fsSL --retry 3 -o cn-ip-cidr.txt \
            https://raw.githubusercontent.com/Hackl0us/GeoIP2-CN/release/CN-ip-cidr.txt

      - name: Download IPverse metadata and IP blocks
        run: |
          curl -fsSL --retry 3 -o as-metadata.json \
            https://raw.githubusercontent.com/ipverse/as-metadata/master/as.json
          curl -fsSL --retry 3 -L -o as-ip-blocks.tar.gz \
            https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz
          tar -xzf as-ip-blocks.tar.gz

      - name: Download O-X-L and X4BNet ASN lists
        run: |
          curl -fsSL --retry 3 -o oxl_hosting.txt \
            https://raw.githubusercontent.com/O-X-L/risk-db-lists/refs/heads/main/asn/kind_hosting.txt
          curl -fsSL --retry 3 -o x4b_datacenter.txt \
            https://raw.githubusercontent.com/X4BNet/lists_vpn/main/input/datacenter/ASN.txt
          echo "O-X-L lines: $(wc -l < oxl_hosting.txt)"
          echo "X4BNet lines: $(wc -l < x4b_datacenter.txt)"

      - name: Keep only ISP
        run: |
          python3 - <<'PY'
          import json, ipaddress, re
          from pathlib import Path
          from bisect import bisect_right

          def extract_asns(text):
              asns = set()
              for m in re.finditer(r'(?i)\bAS(\d+)\b', text):
                  asns.add(int(m.group(1)))
              for line in text.splitlines():
                  line = line.strip()
                  if line.isdigit():
                      asns.add(int(line))
              return asns

          with open("as-metadata.json") as f:
              metadata = json.load(f)

          cn_isp_asns = set()
          for entry in metadata:
              m = entry.get("metadata", {})
              if (m.get("countryCode") == "CN"
                      and m.get("category") == "isp"):
                  cn_isp_asns.add(entry["asn"])

          oxl_asns = extract_asns(Path("oxl_hosting.txt").read_text())
          x4b_asns = extract_asns(Path("x4b_datacenter.txt").read_text())
          hosting_marked = oxl_asns | x4b_asns

          excluded = cn_isp_asns & hosting_marked
          isp_asns = cn_isp_asns - hosting_marked

          print(f"IPverse CN isp ASNs: {len(cn_isp_asns)}")
          print(f"Marked as hosting by O-X-L/X4BNet (excluded): {len(excluded)}")
          print(f"Final pure ISP ASNs: {len(isp_asns)}")

          isp_prefixes = set()
          blocks_root = Path("as")
          for asn in isp_asns:
              for fname in ("ipv4-aggregated.txt", "ipv6-aggregated.txt"):
                  fp = blocks_root / str(asn) / fname
                  if not fp.exists():
                      continue
                  for line in fp.read_text().splitlines():
                      line = line.strip()
                      if line and not line.startswith("#"):
                          isp_prefixes.add(line)

          print(f"Raw ISP prefixes: {len(isp_prefixes)}")

          isp_nets = []
          for p in isp_prefixes:
              try:
                  isp_nets.append(ipaddress.ip_network(p, strict=False))
              except ValueError:
                  pass

          isp_v4 = [n for n in isp_nets if n.version == 4]
          isp_v6 = [n for n in isp_nets if n.version == 6]

          def build_intervals(nets):
              if not nets:
                  return [], []
              intervals = sorted(
                  (int(n.network_address), int(n.broadcast_address)) for n in nets
              )
              ss, ee = [], []
              cs, ce = intervals[0]
              for s, e in intervals[1:]:
                  if s <= ce + 1:
                      ce = max(ce, e)
                  else:
                      ss.append(cs); ee.append(ce)
                      cs, ce = s, e
              ss.append(cs); ee.append(ce)
              return ss, ee

          def contained(start, end, ss, ee):
              i = bisect_right(ss, start) - 1
              return i >= 0 and ee[i] >= end

          v4_s, v4_e = build_intervals(isp_v4)
          v6_s, v6_e = build_intervals(isp_v6)
          print(f"ISP intervals: v4={len(v4_s)}, v6={len(v6_s)}")

          cn_nets = []
          with open("cn-ip-cidr.txt") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  try:
                      cn_nets.append(ipaddress.ip_network(line, strict=False))
                  except ValueError:
                      pass

          kept = []
          removed = 0
          for n in cn_nets:
              s, e = int(n.network_address), int(n.broadcast_address)
              ok = (contained(s, e, v4_s, v4_e) if n.version == 4
                    else contained(s, e, v6_s, v6_e))
              if not ok:
                  removed += 1
                  continue
              kept.append(n)

          assert len(kept) + removed == len(cn_nets)

          v4_kept = [n for n in kept if n.version == 4]
          v6_kept = [n for n in kept if n.version == 6]
          collapsed = []
          if v4_kept:
              collapsed.extend(ipaddress.collapse_addresses(v4_kept))
          if v6_kept:
              collapsed.extend(ipaddress.collapse_addresses(v6_kept))

          for n in collapsed:
              s, e = int(n.network_address), int(n.broadcast_address)
              if n.version == 4:
                  assert contained(s, e, v4_s, v4_e), \
                      f"compressed block {n} not fully inside ISP v4"
              else:
                  assert contained(s, e, v6_s, v6_e), \
                      f"compressed block {n} not fully inside ISP v6"

          with open("ips.txt", "w") as f:
              for n in collapsed:
                  f.write(f"{n}\n")

          print(f"CN total: {len(cn_nets)}")
          print(f"Removed (not pure ISP): {removed}")
          print(f"Kept whole blocks: {len(kept)}")
          print(f"After compression: {len(collapsed)}")
          PY

      - name: Verify ips.txt
        run: |
          echo "===== file info ====="
          ls -la ips.txt
          echo "lines: $(wc -l < ips.txt)"
          echo "md5: $(md5sum ips.txt)"
          echo "===== git status ====="
          git status --porcelain
          echo "===== ignore check ====="
          git check-ignore -v ips.txt || echo "ips.txt is NOT ignored"
          echo "===== head version md5 ====="
          git show HEAD:ips.txt 2>/dev/null | md5sum || echo "ips.txt not yet in HEAD"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ips.txt
          if git diff --cached --quiet; then
            echo "No change in ips.txt, skipping commit."
          else
            git commit -m 'Update ips.txt [skip ci]'
            git push
          fi
